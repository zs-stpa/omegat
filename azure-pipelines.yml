# Submission mode: queue a manual run on the target branch (master or
# releases/*), set submitPR to true and give all three submission parameters.
# The run then tests the submission merged onto that branch and publishes nothing.
# Leave submitPR as false and all three as 'none' for a normal run.
parameters:
  - name: submitPR
    displayName: 'Submission: submit PR information'
    type: boolean
    default: false
  - name: subRepo
    displayName: 'Submission: repository URL (https)'
    type: string
    default: 'none'
  - name: subBranch
    displayName: 'Submission: branch'
    type: string
    default: 'none'
  - name: subCommit
    displayName: 'Submission: tip commit (full 40-character hash)'
    type: string
    default: 'none'

trigger:
  branches:
    include:
      - master
      - releases/*
      - refs/tags/v*
    exclude:
      - release/*
      - standard

# Pull request triggers do not apply to Azure Repos. External submissions
# (request-pull mails, SourceForge merge requests) are validated by a manual
# run in submission mode; see the parameters above.
pr: none

schedules:
  - cron: '0 12 * * 6'
    displayName: Weekly saturday build
    branches:
      include:
        - master
        - releases/*
    always: true

variables:
  GRADLE_USER_HOME: '$(Pipeline.Workspace)/.gradle'
  isRelease: $[contains(variables['Build.SourceBranch'], 'refs/tags/v')]
  isReleasesBranch: $[contains(variables['Build.SourceBranch'], 'refs/heads/releases/')]
  isMain: $[eq(variables['Build.SourceBranch'], 'refs/heads/master')]

stages:
- stage: TestAndDocCI
  condition: and(ne(variables['isRelease'], true), or(eq('${{ parameters.submitPR }}', 'true'), and(ne(variables['Build.Reason'], 'Schedule'), ne(variables['Build.Reason'], 'Manual'))))
  jobs:
  - job: CheckChanges
    displayName: Check commit changes
    steps:
      - checkout: self
        clean: true
        fetchDepth: 0
        fetchFilter: blob:none
        fetchTags: true
        lfs: false
      - template: ci/azure-pipelines/merge_submission_steps.yml
        parameters:
          submitPR: ${{ parameters.submitPR }}
          subRepo: ${{ parameters.subRepo }}
          subBranch: ${{ parameters.subBranch }}
          subCommit: ${{ parameters.subCommit }}
      - bash: |
          doc_changed=false
          dev_doc_changed=false
          non_doc_changed=false
          if [[ "$SUBMIT_PR" == "true" ]]; then
            # submission: label the run, then classify the changes brought in by the merge
            target="${BUILD_SOURCEBRANCH#refs/heads/}"
            echo "##vso[build.updatebuildnumber]sub-${target//\//-}-${SUB_COMMIT:0:12}-${BUILD_BUILDID}"
            echo "##vso[build.addbuildtag]submission"
            echo "##vso[build.addbuildtag]base-$(git rev-parse --short=12 HEAD^1)"
            files=$(git diff --name-only HEAD^1 HEAD)
            echo "Changed files:"; echo "$files"
            for file in $files; do
              if [[ $file =~ ^src/docs/developer/ || $file == src/docs/requirements.txt ]]; then
                dev_doc_changed=true
              elif [[ $file =~ ^src/docs ]]; then
                doc_changed=true
              elif [[ ! ($file =~ ^\. || $file =~ ^ci/ || $file =~ \.ya?ml$ ) ]]; then
                non_doc_changed=true
              fi
            done
          else
            # branch push (master, releases/*): a sync may deliver several
            # commits at once, so run everything
            echo "Branch push: running all jobs"
            doc_changed=true
            dev_doc_changed=true
            non_doc_changed=true
          fi
          echo "changeDoc=$doc_changed changeDevDoc=$dev_doc_changed changeNonDoc=$non_doc_changed"
          echo "##vso[task.setvariable variable=changeDoc;isOutput=true]$doc_changed"
          echo "##vso[task.setvariable variable=changeDevDoc;isOutput=true]$dev_doc_changed"
          echo "##vso[task.setvariable variable=changeNonDoc;isOutput=true]$non_doc_changed"
        env:
          SUBMIT_PR: ${{ parameters.submitPR }}
          SUB_COMMIT: ${{ parameters.subCommit }}
        name: checkChanges
  - job: BuildDocument
    displayName: Build Document and Publish
    dependsOn: CheckChanges
    condition: eq(dependencies.CheckChanges.outputs['checkChanges.changeDoc'], 'true')
    pool:
      vmImage: 'ubuntu-24.04'
    steps:
      - checkout: self
        clean: true
        fetchDepth: 1
        fetchTags: true
        lfs: false
      - template: ci/azure-pipelines/merge_submission_steps.yml
        parameters:
          submitPR: ${{ parameters.submitPR }}
          subRepo: ${{ parameters.subRepo }}
          subBranch: ${{ parameters.subBranch }}
          subCommit: ${{ parameters.subCommit }}
      - template: ci/azure-pipelines/build_doc_steps.yml
        parameters:
          cacheKeyPrefix: ${{ iif(eq(parameters.submitPR, true), 'submission-docs', 'gradle-docs') }}
  - job: BuildDeveloperDocument
    displayName: Build Developer Document
    dependsOn: CheckChanges
    condition: eq(dependencies.CheckChanges.outputs['checkChanges.devDocChanged'], 'true')
    pool:
      vmImage: 'ubuntu-24.04'
    steps:
      - checkout: self
        clean: true
        fetchDepth: 1
        fetchTags: true
        lfs: false
      - template: ci/azure-pipelines/merge_submission_steps.yml
        parameters:
          submitPR: ${{ parameters.submitPR }}
          subRepo: ${{ parameters.subRepo }}
          subBranch: ${{ parameters.subBranch }}
          subCommit: ${{ parameters.subCommit }}
      - template: ci/azure-pipelines/build_dev_doc_steps.yml
        parameters:
          cacheKeyPrefix: ${{ iif(eq(parameters.submitPR, true), 'submission-pip', 'pip') }}
  - job: testOnLinux
    displayName: on Linux
    dependsOn: CheckChanges
    condition: eq(dependencies.CheckChanges.outputs['checkChanges.changeNonDoc'], 'true')
    pool:
      vmImage: 'ubuntu-24.04'
    steps:
      - checkout: self
        fetchDepth: 1
        fetchTags: false
      - template: ci/azure-pipelines/merge_submission_steps.yml
        parameters:
          submitPR: ${{ parameters.submitPR }}
          subRepo: ${{ parameters.subRepo }}
          subBranch: ${{ parameters.subBranch }}
          subCommit: ${{ parameters.subCommit }}
      - template: ci/azure-pipelines/check_steps.yml
        parameters:
          cacheKeyPrefix: ${{ iif(eq(parameters.submitPR, true), 'submission', 'gradle') }}
  - job: testOnWindows
    displayName: on Windows
    dependsOn: CheckChanges
    condition: eq(dependencies.CheckChanges.outputs['checkChanges.changeNonDoc'], 'true')
    pool:
      vmImage: 'windows-latest'
    steps:
      - checkout: self
        fetchDepth: 1
      - template: ci/azure-pipelines/merge_submission_steps.yml
        parameters:
          submitPR: ${{ parameters.submitPR }}
          subRepo: ${{ parameters.subRepo }}
          subBranch: ${{ parameters.subBranch }}
          subCommit: ${{ parameters.subCommit }}
      - template: ci/azure-pipelines/test_steps.yml
        parameters:
          cacheKeyPrefix: ${{ iif(eq(parameters.submitPR, true), 'submission', 'gradle') }}
  - job: testOnMac
    displayName: on mac
    dependsOn: CheckChanges
    condition: eq(dependencies.CheckChanges.outputs['checkChanges.changeNonDoc'], 'true')
    pool:
      vmImage: 'macOS-latest'
    steps:
      - checkout: self
        fetchDepth: 1
        fetchTags: false
      - template: ci/azure-pipelines/merge_submission_steps.yml
        parameters:
          submitPR: ${{ parameters.submitPR }}
          subRepo: ${{ parameters.subRepo }}
          subBranch: ${{ parameters.subBranch }}
          subCommit: ${{ parameters.subCommit }}
      - template: ci/azure-pipelines/test_steps.yml
        parameters:
          cacheKeyPrefix: ${{ iif(eq(parameters.submitPR, true), 'submission', 'gradle') }}

- stage: Weekly
  condition: and(eq('${{ parameters.submitPR }}', 'false'), or(eq(variables['Build.Reason'], 'Schedule'), eq(variables['Build.Reason'], 'Manual')))
  jobs:
  - job: CheckForWeekly
    displayName: Test and Check
    pool:
      vmImage: 'ubuntu-24.04'
    steps:
      - template: ci/azure-pipelines/check_steps.yml
  - job: IntegrationTestForWeekly
    displayName: Integration Test
    pool:
      vmImage: 'ubuntu-24.04'
    steps:
      - checkout: self
        fetchDepth: 1
        fetchTags: false
      - template: ci/azure-pipelines/integ_test_steps.yml
        parameters:
          testType: 'GIT'
          duration: 600
  - job: WeeklyBuild
    displayName: Build for master weekly
    pool:
      vmImage: 'ubuntu-24.04'
    steps:
      - checkout: self
        fetchDepth: 1
        fetchTags: false
      - script: |   
          version=$(./gradlew -qq printVersion | head -n 1)
          echo "##vso[task.setvariable variable=version;isOutput=true]$version"
        name: setVersion
      - template: ci/azure-pipelines/build_steps.yml
      - task: PublishPipelineArtifact@1
        displayName: 'Publish documents artifact'
        inputs:
          targetPath: '$(System.DefaultWorkingDirectory)/build/docs'
          artifact: 'docs'
      - task: PublishPipelineArtifact@1
        displayName: 'Publish distributions artifact'
        inputs:
          targetPath: '$(System.DefaultWorkingDirectory)/build/distributions'
          artifact: 'distributions'

  - job: WeeklyPublish
    dependsOn:
      - WeeklyBuild
      - CheckForWeekly
      - IntegrationTestForWeekly
    variables:
      omegatVersion: $[ dependencies.WeeklyBuild.outputs['setVersion.version'] ]
    steps:
      - script: |
          echo "Release version: $OMEGATVERSION"
          mkdir -p $(Pipeline.Workspace)/build
      - task: DownloadPipelineArtifact@2
        displayName: 'Download distributions artifact'
        inputs:
          artifact: 'distributions'
          path: '$(Pipeline.Workspace)/build/distributions'
      - task: DownloadPipelineArtifact@2
        displayName: 'Download docs artifact'
        inputs:
          artifact: 'docs'
          path: '$(Pipeline.Workspace)/build/docs'
      - template: ci/azure-pipelines/publish_weekly.yml
        parameters:
          omegatVersion: $(omegatVersion)

  # Release steps will run on the main and/or release branch with tags.
- stage: Release
  condition: and(eq('${{ parameters.submitPR }}', 'false'), eq(variables.isRelease, true))
  jobs:
  - job: CheckForRelease
    displayName: Test and Check
    pool:
      vmImage: 'ubuntu-24.04'
    steps:
      - checkout: self
        fetchDepth: 2
      - template: ci/azure-pipelines/check_steps.yml
  - job: ReleaseBuild
    dependsOn: CheckForRelease
    pool:
      vmImage: 'ubuntu-24.04'
    steps:
      - checkout: self
        fetchDepth: 0
        fetchTags: true
      - script: |
          version=$(./gradlew -qq printVersion | head -n 1)
          echo "##vso[task.setvariable variable=version;isOutput=true]$version"
        name: setVersion
      - template: ci/azure-pipelines/build_steps.yml
      - task: PublishPipelineArtifact@1
        displayName: 'Publish documents artifact'
        inputs:
          targetPath: '$(System.DefaultWorkingDirectory)/build/docs'
          artifact: 'docs'
      - task: PublishPipelineArtifact@1
        displayName: 'Publish distributions artifact'
        inputs:
          targetPath: '$(System.DefaultWorkingDirectory)/build/distributions'
          artifact: 'distributions'

  - job: ReleasePublish
    dependsOn: ReleaseBuild
    variables:
      omegatVersion: $[ dependencies.ReleaseBuild.outputs['setVersion.version'] ]
    steps:
      - script: |
          echo "Release version: $OMEGATVERSION"
          mkdir -p $(Pipeline.Workspace)/build
      - task: DownloadPipelineArtifact@2
        displayName: 'Download distributions artifact'
        inputs:
          artifact: 'distributions'
          path: '$(Pipeline.Workspace)/build/distributions'
      - task: DownloadPipelineArtifact@2
        displayName: 'Download docs artifact'
        inputs:
          artifact: 'docs'
          path: '$(Pipeline.Workspace)/build/docs'
      - template: ci/azure-pipelines/publish_release.yml
        parameters:
          omegatVersion: $(omegatVersion)

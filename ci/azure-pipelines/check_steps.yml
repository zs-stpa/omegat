# cacheKeyPrefix separates caches written by untrusted runs. Submission runs
# pass 'submission': they may restore trusted 'gradle' caches, but what they
# save is stored under their own prefix, which no other run restores.
parameters:
  - name: cacheKeyPrefix
    type: string
    default: gradle
    values:
      - gradle
      - submission

steps:
  - task: Cache@2
    displayName: 'Cache Gradle'
    inputs:
      key: '${{ parameters.cacheKeyPrefix }} | "$(Agent.OS)" | gradle/wrapper/gradle-wrapper.properties | settings.gradle | **/build.gradle'
      restoreKeys: |
        gradle | "$(Agent.OS)"
        gradle
      path: '$(GRADLE_USER_HOME)'
  - script: python3 ci/check-docs-assets.py
    displayName: 'Check documentation assets are referenced'
  - task: Gradle@3
    displayName: Check
    inputs:
      tasks: check
      options: '-PenvIsCi --no-daemon --scan -PtestMaxHeapSize=2048M'
      jdkVersionOption: '1.21'
  - task: PublishTestResults@2
    displayName: 'Publish Test Results build/reports/**/*.xml'
    condition: always()
    inputs:
      testResultsFiles: 'build/reports/**/*.xml'
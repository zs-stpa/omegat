# cacheKeyPrefix separates caches written by untrusted runs. Submission runs
# pass 'submission': they may restore trusted 'gradle' caches, but what they
# save is stored under their own prefix, which no other run restores.
parameters:
  - name: cacheKeyPrefix
    type: string
    default: gradle
    values:
      - gradle
      - submission

steps:
  - task: Cache@2
    displayName: 'Cache Gradle'
    inputs:
      key: '${{ parameters.cacheKeyPrefix }} | "$(Agent.OS)" | gradle/wrapper/gradle-wrapper.properties | settings.gradle | **/build.gradle'
      restoreKeys: |
        gradle | "$(Agent.OS)"
        gradle
      path: '$(GRADLE_USER_HOME)'
  - task: Gradle@3
    inputs:
      tasks: 'test'
      options: '--build-cache --no-daemon -PenvIsCi -PtestMaxHeapSize=2048M'
      jdkVersionOption: '1.21'

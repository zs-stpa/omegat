  <rect x="420" y="140" width="1300" height="140" rx="10" fill="#eaf5ec" stroke="#3a7d44" stroke-width="1.6"/>
  <text x="440" y="170" font-size="16" font-weight="bold" fill="#2c5e34">Fixed since 2026-08-01 — kuromoji duplicate and rhino are gone</text>
  <g font-size="12.5" fill="#2f4f36">
    <text x="440" y="196">The ja module no longer carries the kuromoji classes: modules/omegat-language-ja.jar is now 0.05 MB (tokenizer only, 0 shared classes); the single kuromoji copy stays in lib/lucene-</text>
    <text x="440" y="220">analysis-kuromoji-9.12.3.jar (4.5 MB), where it belongs for LanguageTool.</text>
    <text x="440" y="244">rhino is gone from lib/ — scripting runs on nashorn-core (2.0 MB) only.</text>
    <text x="440" y="268">Counter-check: the zh module contains 0 org/apache/lucene classes (smartcn is not duplicated).</text>
  </g>

  <rect x="420" y="300" width="1300" height="164" rx="10" fill="#eaf5ec" stroke="#3a7d44" stroke-width="1.6"/>
  <text x="440" y="330" font-size="16" font-weight="bold" fill="#2c5e34">gRPC chain excluded — 3 jars / 0.4 MB remain for class linking</text>
  <g font-size="12.5" fill="#2f4f36">
    <text x="440" y="356">The LanguageTool core fork (6.8-omt6.2-2) pulls a gRPC client chain for its Synthesizer server, remote BERT and remote ML rules — OmegaT runs none of them; its only LT server is the</text>
    <text x="440" y="380">plain-HTTP bridge.</text>
    <text x="440" y="404">build.gradle excludes the transports and protobuf bindings; absent from lib/: grpc-netty-shaded, grpc-core, grpc-util, grpc-protobuf, grpc-protobuf-lite, proto-google-common-protos.</text>
    <text x="440" y="428">Kept: grpc-api 0.3 MB, grpc-stub 0.1 MB, animal-sniffer-annotations 3 KB — JLanguageTool.check links GRPCPostProcessing and its io.grpc.StatusRuntimeException handlers on every rule</text>
    <text x="440" y="452">match (verified by distributionSmokeTest). protobuf-java 1.8 MB stays for dsl4j (Lingvo DSL).</text>
  </g>

  <rect x="420" y="484" width="1300" height="188" rx="10" fill="#fff8e0" stroke="#c9971a" stroke-width="1.6"/>
  <text x="440" y="514" font-size="16" font-weight="bold" fill="#6b5210">Structural option — up to 171.3 MB (57 %): slim distribution + language packs</text>
  <g font-size="12.5" fill="#5c4a1a">
    <text x="440" y="540">The 30 language jars carry LanguageTool data: spelling dictionaries, synthesis dictionaries, grammar rules — nl alone is 36.2 MB (nl_NL.dict 14.3, dutch_synth.dict 13.5, dutch.dict</text>
    <text x="440" y="564">12.8, unpacked 55.5 MB).</text>
    <text x="440" y="588">Since 2026-08-01 the set went from ≈249 to 171.3 MB and from 29 to 30 modules.</text>
    <text x="440" y="612">Largest modules: nl 36.2 MB, de 21.7 MB, en 16.7 MB, ar 13.9 MB.</text>
    <text x="440" y="636">They remain cleanly modular: no LanguageTool core classes are duplicated inside them (verified). A slim default install with on-demand language</text>
    <text x="440" y="660">packs would lose no function — every pack stays available, just not preinstalled. Every user pays today for all 30 languages; hardly anyone uses more than a handful.</text>
  </g>

  <rect x="420" y="692" width="1300" height="188" rx="10" fill="#eaf5ec" stroke="#3a7d44" stroke-width="1.6"/>
  <text x="440" y="722" font-size="16" font-weight="bold" fill="#2c5e34">Earns its size — keep</text>
  <g font-size="12.5" fill="#2f4f36">
    <text x="440" y="748">icu4j 78.3 (14.5 MB) — used by OmegaT itself (NumeralValueParser, EditorUtils), not by the LanguageTool build (6.8-omt6.2-2, ICU-free).   Team stack ≈ 18.7 MB — bcprov-jdk18on 6.9 ·</text>
    <text x="440" y="772">svnkit 4.1 · jgit 3.3 · sshd-osgi 1.8 (team projects, modern SSH).</text>
    <text x="440" y="796">groovy 8.6 MB in 7 jars — the scripting feature.   lucene-core 4.1 + CJK analyzers — the tokenizers.   fastutil 6.3 — LanguageTool performance.   nashorn-core 2.0 MB — the script</text>
    <text x="440" y="820">engine.</text>
    <text x="440" y="844">docs 6.6 MB — offline manuals.   pdfbox + fontbox 3.6 MB in 3 jars — PDF support.</text>

# Positional shortcuts of the action panel: activate the row shown at
# that position (display order). Same on every platform: Ctrl+digit and
# Ctrl+Alt+digit are taken by match insertion and panel navigation,
# Alt+digit types characters on macOS, and Cmd+Shift+3/4/5 are macOS
# screenshots.
actionPanelRow1=ctrl shift 1
actionPanelRow2=ctrl shift 2
actionPanelRow3=ctrl shift 3
actionPanelRow4=ctrl shift 4
actionPanelRow5=ctrl shift 5
actionPanelRow6=ctrl shift 6
actionPanelRow7=ctrl shift 7
actionPanelRow8=ctrl shift 8
actionPanelRow9=ctrl shift 9
actionPanelRow10=ctrl shift 0

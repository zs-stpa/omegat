name: experimInt integration build

# Runs on every push of the integration branch: quality checks like upstream
# master, plus a macOS (Apple Silicon) build published as a pre-release.
on:
  push:
    branches:
      - integration/all-open
      - experimental-integration

# The build executes gradle scripts of merged third-party PRs: build jobs get
# a read-only token, only the publish job (no build, artifact download only)
# may write releases.
permissions:
  contents: read

concurrency:
  group: experimint-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: "Ωt-experimInt"
  TAG_PREFIX: experimental-integration/
  KEEP_RELEASES: "14"
  JRE_URL: https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.3%2B9/OpenJDK25U-jre_aarch64_mac_hotspot_25.0.3_9.tar.gz

jobs:
  check:
    name: quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: gradle check
        run: ./gradlew -PenvIsCi=true -Pheadless=true -PtestMaxHeapSize=2048M check
      - name: git tree clean after build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "repository not clean after build:"; git status; exit 1
          fi

  mac:
    name: build Mac arm dist
    runs-on: macos-14
    timeout-minutes: 90
    outputs:
      stamp: ${{ steps.build.outputs.stamp }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: download bundled JRE
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asset"
          curl -fL "$JRE_URL" -o "$RUNNER_TEMP/asset/$(basename "$JRE_URL")"
          gzip -t "$RUNNER_TEMP/asset/$(basename "$JRE_URL")"
      - name: build installMacArmDist
        id: build
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d)
          SHA7=$(git rev-parse --short=7 HEAD)
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          ./gradlew --no-configuration-cache -PenvIsCi=true "-PassetDir=$RUNNER_TEMP/asset" \
            "-PrepoRevision=exp-${STAMP}-${SHA7}" installMacArmDist
      - name: package app
        run: ci/experimint/package-mac.sh . "${{ steps.build.outputs.stamp }}" "$APP_NAME"
      - name: compose release body
        run: |
          cat ci/experimint/DISCLAIMER-release.md > dist/body.md
          echo >> dist/body.md
          ci/experimint/release-body.sh . origin/master "${GITHUB_REF_NAME}" >> dist/body.md
      - uses: actions/upload-artifact@v7
        with:
          name: experimint-mac-arm
          path: dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: publish pre-release
    needs: mac
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ci/experimint
      - uses: actions/download-artifact@v8
        with:
          name: experimint-mac-arm
          path: dist/
      - name: create pre-release
        env:
          FORK_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE_TAG=$(date -u +%Y-%m-%d)
          SHA7=$(echo "${GITHUB_SHA}" | cut -c1-7)
          ci/experimint/publish-release.sh \
            "${GITHUB_REPOSITORY}" \
            "${TAG_PREFIX}${DATE_TAG}-${SHA7}" \
            "${APP_NAME} ${DATE_TAG} (${GITHUB_REF_NAME}, ${SHA7})" \
            dist/body.md \
            dist/*.zip \
            "${GITHUB_SHA}" \
            "${KEEP_RELEASES}" \
            "${TAG_PREFIX}"

pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        // 'repository' for getting docbook xsd
        ivy {
            url = 'https://archive.docbook.org/xml'
            patternLayout {
                artifact '[revision]/[module]-[revision].[ext]'
            }
            content {
                includeGroup 'docbook'
            }
            metadataSources {
                artifact()
            }
        }
    }
    // Include 'plugins build' to define convention plugins.
    includeBuild("build-logic")
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'com.gradle.develocity' version '4.5.1'
}
develocity {
    buildScan {
        publishing.onlyIf { "true".equals(System.getProperty("envIsCi")) }
        termsOfUseUrl = "https://gradle.com/terms-of-service"
        termsOfUseAgree = "yes"
    }
}
rootProject.name = 'OmegaT'
// Hunspell dictionary artifacts (org.omegat.dictionaries:dictionary-hunspell-<xx>)
// for the dictionary-only language modules. By default they are built from the
// pinned upstream files (needs network on a fresh checkout); once published,
// -Pomegat.dictionaries=repository resolves them like any other dependency.
if (providers.gradleProperty('omegat.dictionaries').getOrElse('build') == 'build') {
    includeBuild("language-modules/dictionaries")
}
